[package]
name = "panini-oled"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "System stats on the Panini case OLED for the Jetson Orin Nano"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
embedded-graphics = "0.8"
if-addrs = "0.15"
linux-embedded-hal = { version = "0.5", default-features = false, features = ["i2c"] }
nix = { version = "0.31", default-features = false, features = ["fs"] }
signal-hook = "0.4"
ssd1306 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
